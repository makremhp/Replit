kind = "web"
previewPath = "/"
title = "Rewardly Telegram"
description = "A Telegram rewards dashboard for viewing Adsgram tasks, tracking wallet rewards, and reviewing withdrawal activity."
version = "1.0.0"
id = "artifacts/rewardly-telegram"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19841

[services.development]
run = "pnpm --filter @workspace/rewardly-telegram run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rewardly-telegram", "run", "build" ]
serve = "static"
publicDir = "artifacts/rewardly-telegram/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19841"
BASE_PATH = "/"
