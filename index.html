<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ستة بيوت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- ===== نظام الإعلانات: سوشيال (أول شي بالكامل) ===== -->
<script src="https://interventioncopiedloitering.com/5d/77/0f/5d770ff402768d79ddda9c1cd67e9819.js"></script>
<script src="https://interventioncopiedloitering.com/96/90/da/9690da690d344e2579dffa12d4e2ac24.js"></script>
<script src="https://interventioncopiedloitering.com/f0/07/9c/f0079c7c7d8c3c01bd28c4116a805f4a.js"></script>
<script src="https://interventioncopiedloitering.com/7e/7f/2b/7e7f2b6f7c43d86c6859e5b0a40afe3e.js"></script>
<script src="https://interventioncopiedloitering.com/7e/28/55/7e2855c2f9fb53ed0ca536022ca067df.js"></script>
<script src="https://interventioncopiedloitering.com/d0/f6/b3/d0f6b318f29b5787025697029ae72f23.js"></script>
<script src="https://interventioncopiedloitering.com/58/0d/ca/580dcaa1a10c7fb3943a7ea94b700f42.js"></script>
<script src="https://interventioncopiedloitering.com/da/5e/c3/da5ec3a230bfa740492f3f78bd1ed182.js"></script>

<!-- ===== إعلانات 320×50 ثابتة — أعلى الصفحة قبل كل شي ===== -->
<div class="ad-static-top" style="display:flex;flex-direction:column;align-items:center;gap:4px;">
  <div id="adTop1" style="width:320px;height:50px;"></div>
  <div id="adTop2" style="width:320px;height:50px;"></div>
  <div id="adTop3" style="width:320px;height:50px;"></div>
</div>

  <div class="topbar">
    <button class="wallet-btn-icon" id="walletBtn" aria-label="Wallet">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h11A2.5 2.5 0 0 1 19 7.5V8h-3.5A2.5 2.5 0 0 0 13 10.5v3A2.5 2.5 0 0 0 15.5 16H19v.5A2.5 2.5 0 0 1 16.5 19h-11A2.5 2.5 0 0 1 3 16.5v-9Z" stroke="#d4af37" stroke-width="1.4" stroke-linejoin="round"/><path d="M15.5 10h3.5a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-3.5a1.5 1.5 0 0 1-1.5-1.5v-1a1.5 1.5 0 0 1 1.5-1.5Z" stroke="#d4af37" stroke-width="1.4"/></svg>
    </button>
    <button class="share-btn" id="shareBtn" aria-label="Share">
      <svg viewBox="0 0 24 24" fill="none"><path d="M18 8a3 3 0 1 0-2.83-4H15a3 3 0 0 0 .1 1.83L8.9 9.1a3 3 0 1 0 0 5.8l6.2 3.27a3 3 0 1 0 .9-1.7L9.8 13.2a3 3 0 0 0 0-2.4l6.2-3.27c.55.3 1.18.47 1.9.47Z" stroke="#d4af37" stroke-width="1.4" stroke-linejoin="round"/></svg>
    </button>
    <div class="balance-pill">
      <div class="coin-ic"></div>
      <div class="amount" id="balanceAmount">0.0000</div>
      <div class="unit">USDT</div>
    </div>
  </div>

  <div class="wallet-page" id="walletPage">
    <div class="wallet-header">
      <button class="wallet-back" id="walletBackBtn">‹</button>
      <div class="wallet-title" id="walletTitleText"></div>
    </div>
    <div class="wallet-body">
      <div class="wallet-balance-card">
        <div class="wallet-balance-label" id="walletBalanceLabel"></div>
        <div class="wallet-balance-row">
          <div class="coin-ic"></div>
          <div class="wallet-balance-amount" id="walletBalanceAmount">0.0000</div>
          <div class="unit">USDT</div>
        </div>
      </div>

      <div class="wallet-divider" id="walletDividerLabel"></div>

      <div class="wallet-field">
        <div class="wallet-field-label" id="walletAddressLabel"></div>
        <input type="text" class="wallet-input" id="tonAddressInput">
        <div class="wallet-hint" id="walletMinNote"></div>
      </div>

      <div class="wallet-actions">
        <button class="wallet-action-btn primary" id="withdrawBtn"></button>
        <button class="wallet-action-btn secondary" id="watchAdBtn"></button>
      </div>
    </div>
  </div>

  <section class="hero-intro" aria-labelledby="heroTitle">
    <div class="hero-eyebrow" id="heroEyebrow"></div>
    <h1 id="heroTitle"></h1>
    <p id="heroSubtitle"></p>
  </section>

  <div class="boxes-wrap" id="boxesWrap"></div>

  <div class="battle-stage" id="battleStage">
    <div class="stage-ground"></div>
  </div>

  <div class="toast" id="toast"></div>
  <div id="fxLayer"></div>

  <div class="modal-overlay" id="houseModal">
    <div class="modal-card">
      <img class="modal-house-img" id="modalHouseImg" src="">
      <div class="modal-name" id="modalName"></div>
      <div class="modal-status" id="modalStatus"></div>
      <div class="modal-perk" id="modalPerk"></div>
      <div class="modal-progress-track" id="modalProgressTrack" style="display:none;">
        <div class="modal-progress-fill" id="modalProgressFill"></div>
      </div>
      <button class="modal-btn" id="modalActionBtn"></button>
      <button class="modal-close" id="modalCloseBtn"></button>
    </div>
  </div>

  <audio id="zombieSound" src="asesst/zombie-sound.wav" preload="auto"></audio>

<script src="js/i18n.js"></script>
<script src="js/houses.js"></script>
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/battle.js"></script>
<script src="js/wallet.js"></script>

<!-- ===== إعلانات 320×50 ثابتة — أسفل الصفحة بعد كل شي ===== -->
<div class="ad-static-bottom" style="display:flex;flex-direction:column;align-items:center;gap:4px;">
  <div id="adBottom1" style="width:320px;height:50px;"></div>
  <div id="adBottom2" style="width:320px;height:50px;"></div>
  <div id="adBottom3" style="width:320px;height:50px;"></div>
</div>

<script src="js/ads.js"></script>
</body>
</html>
