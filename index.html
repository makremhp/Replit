  .battle-stage { position:relative; z-index:1; width:min(calc(100% - 32px),620px); min-height:330px; flex:1 1 auto; margin:20px auto 0; overflow:hidden; border:1px solid rgba(118,224,195,.2); border-radius:30px; background:radial-gradient(circle at 50% 108%,rgba(118,224,195,.13),transparent 50%),linear-gradient(180deg,rgba(13,35,47,.68),rgba(5,14,21,.84)); box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.07); }
  .battle-stage::before { content:''; position:absolute; inset:0; opacity:.32; background-image:linear-gradient(rgba(174,204,217,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(174,204,217,.06) 1px,transparent 1px); background-size:32px 32px; mask-image:linear-gradient(to bottom,black 10%,transparent 78%); } .battle-stage::after { content:'ACTIVE ARENA'; position:absolute; top:17px; left:18px; color:rgba(150,170,181,.55); font-size:8px; font-weight:900; letter-spacing:2px; } .stage-ground { position:absolute; left:0; right:0; bottom:0; height:28%; background:linear-gradient(180deg,transparent,rgba(3,9,14,.7) 70%),radial-gradient(ellipse at center bottom,rgba(118,224,195,.14),transparent 64%); border-top:1px solid rgba(118,224,195,.12); }
  #fxLayer { position:fixed; inset:0; pointer-events:none; z-index:50; } .zombie { position:absolute; width:58px; height:58px; background-size:contain; background-repeat:no-repeat; background-position:center; z-index:4; filter:drop-shadow(0 8px 8px rgba(0,0,0,.42)); animation:enemyFloat 2.1s ease-in-out infinite; } .zombie.dying { animation:zdie .4s ease forwards; } .bullet { position:absolute; width:24px; height:24px; background-size:contain; background-repeat:no-repeat; background-position:center; z-index:6; pointer-events:none; filter:drop-shadow(0 0 8px rgba(215,181,109,.8)); } .fx { position:absolute; width:52px; height:52px; background-size:contain; background-repeat:no-repeat; background-position:center; z-index:7; pointer-events:none; transform:translate(-50%,-50%) scale(.3); opacity:0; animation:fxpop .6s ease-out forwards; } .coin { position:absolute; width:36px; height:36px; background-size:contain; background-repeat:no-repeat; background-position:center; filter:drop-shadow(0 0 12px rgba(118,224,195,.55)); z-index:8; animation:coinFloat 1.5s ease-in-out infinite; cursor:pointer; }
  .floattext { position:absolute; font-weight:900; font-size:12px; color:var(--gold-soft); z-index:9; pointer-events:none; animation:floatUp .9s ease-out forwards; text-shadow:0 2px 6px rgba(0,0,0,.7); white-space:nowrap; }

  .modal-overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(2,8,12,.73); backdrop-filter:blur(13px); z-index:80; opacity:0; pointer-events:none; transition:opacity .25s ease; } .modal-overlay.show { opacity:1; pointer-events:auto; } .modal-card { position:relative; width:min(100%,360px); padding:30px 24px 22px; display:flex; flex-direction:column; align-items:center; text-align:center; border:1px solid rgba(118,224,195,.24); border-radius:28px; background:linear-gradient(155deg,rgba(22,46,60,.97),rgba(9,21,29,.98)); box-shadow:0 28px 90px rgba(0,0,0,.5),inset 0 1px rgba(255,255,255,.1); transform:translateY(12px) scale(.97); transition:transform .3s cubic-bezier(.2,.8,.2,1); } .modal-overlay.show .modal-card { transform:translateY(0) scale(1); } .modal-card .modal-house-img { width:128px; height:128px; object-fit:contain; margin:-8px 0 11px; filter:drop-shadow(0 16px 14px rgba(0,0,0,.4)); } .modal-card .modal-name { color:var(--gold-soft); font-size:19px; font-weight:900; margin-bottom:6px; } .modal-card .modal-status { font-size:11px; font-weight:800; margin-bottom:15px; } .modal-card .modal-status.is-active { color:var(--mint); } .modal-card .modal-status.is-unlocked { color:var(--gold-soft); } .modal-card .modal-status.is-locked { color:var(--danger); } .modal-card .modal-perk { width:100%; padding:12px 13px; margin-bottom:16px; color:var(--muted); font-size:11.5px; line-height:1.7; border:1px solid rgba(174,204,217,.12); border-radius:14px; background:rgba(255,255,255,.035); } .modal-card .modal-progress-track { width:100%; height:5px; overflow:hidden; margin:-4px 0 16px; border-radius:9px; background:rgba(255,255,255,.09); } .modal-card .modal-progress-fill { height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--gold),var(--gold-soft)); } .modal-card .modal-btn { width:100%; padding:13px; border:0; border-radius:14px; color:#102018; background:linear-gradient(100deg,var(--mint),#b4f0d9); font-size:13px; font-weight:900; cursor:pointer; } .modal-card .modal-btn.disabled { color:#74838a; background:rgba(255,255,255,.08); cursor:default; } .modal-card .modal-close { width:100%; margin-top:9px; padding:10px; border:0; border-radius:12px; color:var(--muted); background:transparent; font-size:12px; font-weight:800; cursor:pointer; }

  return svgData('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="' + t.a + '"/><stop offset="1" stop-color="' + t.b + '"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity=".35"/></filter></defs><path d="M29 78 90 30l61 48v67a9 9 0 0 1-9 9H38a9 9 0 0 1-9-9V78Z" fill="' + t.dark + '" stroke="url(#g)" stroke-width="3" filter="url(#s)"/><path d="m20 78 70-55 70 55-9 11-61-48-61 48-9-11Z" fill="url(#g)"/><path d="M59 154v-39a7 7 0 0 1 7-7h48a7 7 0 0 1 7 7v39" fill="#0b1721" stroke="' + t.b + '" stroke-width="3"/><circle cx="90" cy="67" r="10" fill="#fff" fill-opacity=".16" stroke="' + t.b + '" stroke-width="2"/><path d="M90 58v18M81 67h18" stroke="' + t.b + '" stroke-width="2" stroke-linecap="round"/></svg>');

  return svgData('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="z" x1="0" y1="0" x2="1" y2="1"><stop stop-color="' + t.a + '"/><stop offset="1" stop-color="' + t.dark + '"/></linearGradient></defs><path d="M20 84V43C20 22 34 11 50 11s30 11 30 32v41l-10-7-10 7-10-7-10 7-10-7-10 7Z" fill="url(#z)" stroke="#f5f8f8" stroke-opacity=".7" stroke-width="3"/><circle cx="39" cy="46" r="6" fill="#071018"/><circle cx="61" cy="46" r="6" fill="#071018"/><circle cx="39" cy="45" r="2" fill="#fff"/><circle cx="61" cy="45" r="2" fill="#fff"/><path d="M38 64c8 7 16 7 24 0" fill="none" stroke="#071018" stroke-width="4" stroke-linecap="round"/></svg>');

const ZOMBIE_SPAWN_MS = 1900;
const ZOMBIE_SPEED = 0.012;
const TICK_MS = 60;
const FIRE_COOLDOWN_MS = 650;
const BULLET_TRAVEL_MS = 2200;
const COIN_VALUE = 0.005;
const COIN_INTERVAL_MS = 15000;

/* ===================== الحالة العامة (نموذج تجريبي محلي) ===================== */
const State = {
  balance: parseFloat(localStorage.getItem('sh_balance') || '0'),
  progress: JSON.parse(localStorage.getItem('sh_progress') || '{"referrals":0,"ads":0,"deposit":0}'),
  unlockedHouses: JSON.parse(localStorage.getItem('sh_unlocked') || '[1]'),
  activeHouseId: parseInt(localStorage.getItem('sh_active') || '1', 10),
};

function saveState() {
  localStorage.setItem('sh_balance', State.balance.toFixed(6));
  localStorage.setItem('sh_progress', JSON.stringify(State.progress));
  localStorage.setItem('sh_unlocked', JSON.stringify(State.unlockedHouses));
  localStorage.setItem('sh_active', String(State.activeHouseId));
}

function isUnlocked(house) { return house.unlocked || State.unlockedHouses.includes(house.id); }

function unlockProgressFor(house) {
  if (!house.unlock) return { have: 1, need: 1 };
  const { type, need } = house.unlock;
  if (type === 'referrals') return { have: State.progress.referrals, need };
  if (type === 'ads')       return { have: State.progress.ads, need };
  if (type === 'deposit')   return { have: State.progress.deposit, need };
  return { have: 0, need: 1 };
}

function unlockLabel(house) {
  if (!house.unlock) return '';
  const { type, need } = house.unlock;
  if (type === 'referrals') return need === 1 ? T.oneReferral : T.referralsN(need);
  if (type === 'ads')       return T.adsN(need);
  if (type === 'deposit')   return T.depositN(need);
  return '';
}

function checkUnlocks() {
  let changed = false;
  HOUSES.forEach(h => {
    if (h.unlocked || State.unlockedHouses.includes(h.id)) return;
    const p = unlockProgressFor(h);
    if (p.have >= p.need) {
      State.unlockedHouses.push(h.id);
      changed = true;
      showToast(T.unlockedToast(hName(h)));
    }
  });
  if (changed) { saveState(); renderBoxes(); }
}

function renderBalance() {
  document.getElementById('balanceAmount').textContent = State.balance.toFixed(4);
  const w = document.getElementById('walletBalanceAmount');
  if (w) w.textContent = State.balance.toFixed(4);
}

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ===================== شبكة اختيار البيوت (بدون معركة داخلها) ===================== */
const boxThumbEls = {}; // houseId -> the house-thumb <img> element, used as the firing point
function renderBoxes() {
  const wrap = document.getElementById('boxesWrap');
  wrap.innerHTML = '';
  HOUSES.forEach(house => {
    const unlocked = isUnlocked(house);
    const box = document.createElement('div');
    box.className = 'box' + (unlocked ? ' unlocked' : ' locked') + (house.id === State.activeHouseId ? ' active' : '');

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = hName(house);
    box.appendChild(label);

    const thumb = document.createElement('img');
    thumb.className = 'house-thumb';
    thumb.src = house.img;
     thumb.alt = hName(house);
    box.appendChild(thumb);
    boxThumbEls[house.id] = thumb;

    if (!unlocked) {
      const badge = document.createElement('div');
      badge.className = 'lockbadge';
      badge.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M6 10V8a6 6 0 1 1 12 0v2" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/><rect x="4" y="10" width="16" height="10" rx="2" stroke="#d4af37" stroke-width="2"/></svg>';
      box.appendChild(badge);

      const p = unlockProgressFor(house);
      const need = document.createElement('div');
      need.className = 'need';
      need.textContent = unlockLabel(house);
      box.appendChild(need);

      const track = document.createElement('div');
      track.className = 'progress-track';
      const fill = document.createElement('div');
      fill.className = 'progress-fill';
      fill.style.width = Math.min(100, (p.have / p.need) * 100) + '%';
      track.appendChild(fill);
      box.appendChild(track);
    }

    box.addEventListener('click', () => openHouseModal(house));
    wrap.appendChild(box);
  });
}

function activateHouse(house) {
  if (house.id === State.activeHouseId) return;
  stopBattle();
  State.activeHouseId = house.id;
  saveState();
  renderBoxes();
  startBattle(house);
}

function formatProgress(p, type) {
  if (type === 'deposit') return `$${p.have.toFixed(3)} / $${p.need}`;
  return `${p.have} / ${p.need}`;
}

/* ===================== نافذة معلومات البيت (تظهر وسط الشاشة عند الضغط) ===================== */
const houseModal = document.getElementById('houseModal');
const modalHouseImg = document.getElementById('modalHouseImg');
const modalName = document.getElementById('modalName');
const modalStatus = document.getElementById('modalStatus');
const modalPerk = document.getElementById('modalPerk');
const modalProgressTrack = document.getElementById('modalProgressTrack');
const modalProgressFill = document.getElementById('modalProgressFill');
const modalActionBtn = document.getElementById('modalActionBtn');
const modalCloseBtn = document.getElementById('modalCloseBtn');

function openHouseModal(house) {
  const unlocked = isUnlocked(house);
  const isActive = house.id === State.activeHouseId;

  modalHouseImg.src = house.img;
  modalHouseImg.alt = hName(house);
  modalName.textContent = hName(house);
  modalPerk.textContent = hPerkDesc(house) || '';

  modalProgressTrack.style.display = 'none';
  if (!unlocked) {
    const p = unlockProgressFor(house);
    modalStatus.textContent = T.statusLocked(unlockLabel(house), formatProgress(p, house.unlock.type));
    modalStatus.className = 'modal-status is-locked';
    modalProgressTrack.style.display = 'block';
    modalProgressFill.style.width = Math.min(100, (p.have / p.need) * 100) + '%';
    modalActionBtn.textContent = T.lockedBtn;
    modalActionBtn.className = 'modal-btn disabled';
    modalActionBtn.onclick = null;
  } else if (isActive) {
    modalStatus.textContent = T.statusActive;
    modalStatus.className = 'modal-status is-active';
    modalActionBtn.textContent = T.activeBtn;
    modalActionBtn.className = 'modal-btn disabled';
    modalActionBtn.onclick = null;
  } else {
    modalStatus.textContent = T.statusUnlocked;
    modalStatus.className = 'modal-status is-unlocked';
    modalActionBtn.textContent = T.activateBtn;
    modalActionBtn.className = 'modal-btn primary';
    modalActionBtn.onclick = () => { activateHouse(house); closeHouseModal(); };
  }

  houseModal.classList.add('show');
}

function closeHouseModal() {
  houseModal.classList.remove('show');
}

modalCloseBtn.textContent = T.closeBtn;
modalCloseBtn.addEventListener('click', closeHouseModal);
houseModal.addEventListener('click', (e) => { if (e.target === houseModal) closeHouseModal(); });

let zombies = [];
let lastFire = 0;
let bulletActive = false;

function playZombieSound() {
  const snd = zombieSound.cloneNode(true);
  snd.volume = 0.5;
  snd.play().catch(() => {});
}

function spawnZombie(house) {
  const rect = stage.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'zombie';
  const zombieSprite = ALL_ZOMBIE_TYPES[Math.floor(Math.random() * ALL_ZOMBIE_TYPES.length)];
  el.style.backgroundImage = 'url("' + zombieSprite + '")';
  const laneX = 10 + Math.random() * (rect.width - 62);
  el.style.left = laneX + 'px';
  el.style.bottom = '0px';
  stage.appendChild(el);
  zombies.push({ el, x: laneX, progress: 0, alive: true });
  playZombieSound();
}

/* نقطة الإطلاق = مكان البيت النشط الفعلي داخل شبكة الاختيار (لا بيت ثاني بالساحة) */
function muzzlePoint(house) {
  const thumb = boxThumbEls[house.id];
  const r = thumb.getBoundingClientRect();
  return {
    x: r.left + r.width / 2,
    y: r.top + r.height * 0.2,
  };
}

function fireAt(house, zombie) {
  bulletActive = true;
  const muzzle = muzzlePoint(house);
  let x = muzzle.x, y = muzzle.y;

  const zRect0 = zombie.el.getBoundingClientRect();
  const initDist = Math.hypot(
    (zRect0.left + zRect0.width / 2) - x,
    (zRect0.top + zRect0.height * 0.3) - y
  ) || 1;
  const speed = initDist / BULLET_TRAVEL_MS; // px/ms — كل الطلقات تاخذ نفس المدة تقريبًا بغض النظر عن المسافة

  const bullet = document.createElement('div');
  bullet.className = 'bullet';
  bullet.style.backgroundImage = 'url("' + house.bullet + '")';
  bullet.style.left = x + 'px';
  bullet.style.top = y + 'px';
  fxLayer.appendChild(bullet);

  let last = performance.now();
  function step(now) {
    if (!zombie.alive) { bullet.remove(); bulletActive = false; return; }
    const dt = now - last;
    last = now;
    const zRect = zombie.el.getBoundingClientRect();
    const tx = zRect.left + zRect.width / 2;
    const ty = zRect.top + zRect.height * 0.3;
    const dx = tx - x, dy = ty - y;
    const dist = Math.hypot(dx, dy);
    const angle = Math.atan2(dy, dx) * (180 / Math.PI) + 90;
    bullet.style.transform = `translate(-50%,-50%) rotate(${angle}deg)`;

    if (dist < 16) {
      bullet.remove();
      explodeAt(house, tx, ty);
      killZombie(zombie, house);
      bulletActive = false;
      return;
    }
    const move = Math.min(dist, speed * dt);
    x += (dx / dist) * move;
    y += (dy / dist) * move;
    bullet.style.left = x + 'px';
    bullet.style.top = y + 'px';
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function explodeAt(house, x, y) {
  const fx = document.createElement('div');
  fx.className = 'fx';
  fx.style.backgroundImage = 'url("' + house.fx + '")';
  fx.style.left = x + 'px';
  fx.style.top = y + 'px';
  fxLayer.appendChild(fx);
  setTimeout(() => fx.remove(), 620);
}

function killZombie(zombie, house) {
  if (!zombie.alive) return;
  zombie.alive = false;
  zombie.el.classList.add('dying');
  if (house && house.perk && house.perk.type === 'killBonus' && Math.random() < house.perk.chance) {
    const sRect = stage.getBoundingClientRect();
    const zRect = zombie.el.getBoundingClientRect();
    const relX = zRect.left - sRect.left + zRect.width / 2;
    const relY = zRect.top - sRect.top;
    addBalance(currentCoinValue(), relX, relY);
  }
  setTimeout(() => zombie.el.remove(), 400);
  zombies = zombies.filter(z => z !== zombie);
}

/* ===================== عملات الرصيد داخل الساحة ===================== */
let currentCoinEl = null;

function currentCoinValue() {
  const h = HOUSES.find(x => x.id === State.activeHouseId);
  if (h && h.perk && h.perk.type === 'coinValue') return COIN_VALUE * h.perk.multiplier;
  return COIN_VALUE;
}

function spawnCoin() {
  if (currentCoinEl) { currentCoinEl.remove(); currentCoinEl = null; }
  const rect = stage.getBoundingClientRect();
  const coin = document.createElement('div');
  coin.className = 'coin';
  const cx = 12 + Math.random() * (rect.width - 40);
  const cy = 14 + Math.random() * (rect.height * 0.4);
  coin.style.left = cx + 'px';
  coin.style.top = cy + 'px';
  coin.style.backgroundImage = 'url("asesst/coin-usdt.png")';
  coin.addEventListener('click', (e) => {
    e.stopPropagation();
    addBalance(currentCoinValue(), cx + 14, cy);
    coin.remove();
    if (currentCoinEl === coin) currentCoinEl = null;
  });
  stage.appendChild(coin);
  currentCoinEl = coin;
}

function addBalance(amount, x, y) {
  State.balance += amount;
  saveState();
  renderBalance();
  spawnFloatText(x, y, `+${amount.toFixed(3)}$`);
}

function spawnFloatText(x, y, text) {
  const t = document.createElement('div');
  t.className = 'floattext';
  t.textContent = text;
  t.style.left = x + 'px';
  t.style.top = y + 'px';
  stage.appendChild(t);
  setTimeout(() => t.remove(), 900);
}

function gameTick(house) {
  const rect = stage.getBoundingClientRect();
  zombies.forEach(z => {
    if (!z.alive) return;
    z.progress = Math.min(1, z.progress + ZOMBIE_SPEED);
    const bottom = z.progress * (rect.height * 0.78);
    z.el.style.bottom = bottom + 'px';
    if (z.progress >= 1) killZombie(z, house);
  });

  const now = performance.now();
  if (!bulletActive && zombies.length && now - lastFire > FIRE_COOLDOWN_MS) {
    const target = zombies.reduce((a, b) => (a.progress > b.progress ? a : b));
    fireAt(house, target);
    lastFire = now;
  }
}

let battleTimers = [];
function startBattle(house) {
  stopBattle();
  const spawnT = setInterval(() => spawnZombie(house), ZOMBIE_SPAWN_MS);
  const tickT = setInterval(() => gameTick(house), TICK_MS);
  const coinInterval = (house.perk && house.perk.type === 'coinRate') ? house.perk.intervalMs : COIN_INTERVAL_MS;
  const coinT = setInterval(spawnCoin, coinInterval);
  const firstCoin = setTimeout(spawnCoin, 2000);
  battleTimers = [spawnT, tickT, coinT, firstCoin];

  if (house.perk && house.perk.type === 'passive') {
    const passiveT = setInterval(() => {
      const rect = stage.getBoundingClientRect();
      addBalance(house.perk.amount, rect.width / 2, 26);
    }, house.perk.intervalMs);
    battleTimers.push(passiveT);
  }
}

function stopBattle() {
  battleTimers.forEach(t => { clearInterval(t); clearTimeout(t); });
  battleTimers = [];
  zombies.forEach(z => { z.alive = false; z.el.remove(); });
  zombies = [];
  bulletActive = false;
  if (currentCoinEl) { currentCoinEl.remove(); currentCoinEl = null; }
}

/* ===================== تشغيل اللعبة ===================== */
renderBalance();
renderBoxes();
checkUnlocks();
const activeHouse = HOUSES.find(h => h.id === State.activeHouseId) || HOUSES[0];
startBattle(activeHouse);

/* =========================================================
   نقاط ربط لاحقة بالباك إند الحقيقي:
   - State.progress.referrals / ads / deposit ← تحدَّث من السيرفر الحقيقي
   - State.balance ← يُزامن مع رصيد المستخدم في قاعدة البيانات
   بعد أي تحديث حقيقي: نادِ checkUnlocks() و saveState() و renderBalance()
   ========================================================= */
</script>

  iframe.style.border = '0';
  iframe.style.overflow = 'hidden';
  iframe.scrolling = 'no';
  container.appendChild(iframe);

    '<script src="https://interventioncopiedloitering.com/' + key + '/invoke.js"><\/script>'

}
