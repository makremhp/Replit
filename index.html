<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ستة بيوت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- ===== إعلانات 320×50 ثابتة — أعلى الصفحة قبل كل شي ===== -->
<div class="ad-static-top" style="display:flex;flex-direction:column;align-items:center;gap:4px;">
  <div id="adTop1" style="width:320px;height:50px;"></div>
  <div id="adTop2" style="width:320px;height:50px;"></div>
  <div id="adTop3" style="width:320px;height:50px;"></div>
</div>

  <div class="topbar">
    <button class="wallet-btn-icon" id="walletBtn" aria-label="Wallet">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h11A2.5 2.5 0 0 1 19 7.5V8h-3.5A2.5 2.5 0 0 0 13 10.5v3A2.5 2.5 0 0 0 15.5 16H19v.5A2.5 2.5 0 0 1 16.5 19h-11A2.5 2.5 0 0 1 3 16.5v-9Z" stroke="#d4af37" stroke-width="1.4" stroke-linejoin="round"/><path d="M15.5 10h3.5a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-3.5a1.5 1.5 0 0 1-1.5-1.5v-1a1.5 1.5 0 0 1 1.5-1.5Z" stroke="#d4af37" stroke-width="1.4"/></svg>
    </button>
    <button class="share-btn" id="shareBtn" aria-label="Share">
      <svg viewBox="0 0 24 24" fill="none"><path d="M18 8a3 3 0 1 0-2.83-4H15a3 3 0 0 0 .1 1.83L8.9 9.1a3 3 0 1 0 0 5.8l6.2 3.27a3 3 0 1 0 .9-1.7L9.8 13.2a3 3 0 0 0 0-2.4l6.2-3.27c.55.3 1.18.47 1.9.47Z" stroke="#d4af37" stroke-width="1.4" stroke-linejoin="round"/></svg>
    </button>
    <div class="balance-pill">
      <div class="coin-ic"></div>
      <div class="amount" id="balanceAmount">0.0000</div>
      <div class="unit">USDT</div>
    </div>
  </div>

  <div class="wallet-page" id="walletPage" aria-hidden="true">
    <header class="wallet-header">
      <button class="wallet-back" id="walletBackBtn" aria-label="Back">‹</button>
      <div class="wallet-title-group">
        <span class="wallet-kicker" id="walletKicker"></span>
        <div class="wallet-title" id="walletTitleText"></div>
      </div>
      <span class="wallet-network">TON · USDT</span>
    </header>
    <main class="wallet-body">
      <section class="wallet-balance-card" aria-labelledby="walletBalanceLabel">
        <div class="wallet-balance-top">
          <span class="wallet-balance-label" id="walletBalanceLabel"></span>
          <span class="wallet-live-status"><span></span> Live</span>
        </div>
        <div class="wallet-balance-row">
          <div class="coin-ic"></div>
          <div class="wallet-balance-amount" id="walletBalanceAmount">0.0000</div>
          <div class="unit">USDT</div>
        </div>
        <div class="wallet-balance-meta">
          <span id="walletBalanceHint"></span>
          <strong id="walletProgressText"></strong>
        </div>
        <div class="wallet-progress-track" aria-hidden="true"><span id="walletProgressFill"></span></div>
      </section>

      <div class="wallet-info-grid">
        <div class="wallet-info-card"><span class="wallet-info-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M13 2 5.5 13h5L9.5 22 18.5 10h-5L13 2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span><div><strong id="walletSpeedLabel"></strong><small id="walletSpeedValue"></small></div></div>
        <div class="wallet-info-card"><span class="wallet-info-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span><div><strong id="walletNetworkLabel"></strong><small>TON Network</small></div></div>
      </div>

      <div class="wallet-divider" id="walletDividerLabel"></div>
      <section class="wallet-withdraw-panel">
        <div class="wallet-section-heading"><div><span class="wallet-section-eyebrow">TON CONNECT</span><h2 id="walletAddressLabel"></h2></div><span class="wallet-step">01</span></div>
        <div class="wallet-connect-row">
          <button class="wallet-connect-btn" id="connectWalletBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7.5 8.5h9A3.5 3.5 0 0 1 20 12v1a3.5 3.5 0 0 1-3.5 3.5h-9A3.5 3.5 0 0 1 4 13v-1a3.5 3.5 0 0 1 3.5-3.5Z" stroke="currentColor" stroke-width="1.7"/><path d="M8 8.5V7a4 4 0 0 1 8 0v1.5M9 12.5h.01M12 12.5h.01M15 12.5h.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            <span id="connectWalletBtnText"></span>
          </button>
          <button class="wallet-disconnect-btn" id="disconnectWalletBtn" type="button" hidden>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 4H6.5A2.5 2.5 0 0 0 4 6.5v11A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5V15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M14 4h6v6M20 4l-8 8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="disconnectWalletBtnText"></span>
          </button>
        </div>
        <div class="wallet-connection-status" id="walletConnectionStatus"><span class="wallet-status-dot" id="walletConnectionDot"></span><span id="walletConnectionStatusText"></span></div>
        <div class="wallet-input-wrap">
          <input type="text" class="wallet-input" id="tonAddressInput" autocomplete="off" spellcheck="false" readonly aria-readonly="true">
          <button class="wallet-copy-btn" id="copyAddressBtn" type="button" aria-label="Copy address"></button>
        </div>
        <div class="wallet-hint-row"><span class="wallet-hint" id="walletMinNote"></span><span class="wallet-hint valid-hint">TON only</span></div>
      </section>

      <div class="wallet-actions">
        <button class="wallet-action-btn primary" id="withdrawBtn"></button>
        <button class="wallet-action-btn secondary" id="watchAdBtn"></button>
      </div>
      <p class="wallet-security-note" id="walletSecurityNote"></p>
    </main>
  </div>

  <section class="hero-intro" aria-labelledby="heroTitle">
    <div class="hero-eyebrow" id="heroEyebrow"></div>
    <h1 id="heroTitle"></h1>
    <p id="heroSubtitle"></p>
  </section>

  <div class="boxes-wrap" id="boxesWrap"></div>

  <div class="battle-stage" id="battleStage">
    <div class="stage-ground"></div>
  </div>

  <div class="toast" id="toast"></div>
  <div id="fxLayer"></div>

  <div class="modal-overlay" id="houseModal">
    <div class="modal-card">
      <img class="modal-house-img" id="modalHouseImg" src="">
      <div class="modal-name" id="modalName"></div>
      <div class="modal-status" id="modalStatus"></div>
      <div class="modal-perk" id="modalPerk"></div>
      <div class="modal-progress-track" id="modalProgressTrack" style="display:none;">
        <div class="modal-progress-fill" id="modalProgressFill"></div>
      </div>
      <button class="modal-btn" id="modalActionBtn"></button>
      <button class="modal-close" id="modalCloseBtn"></button>
    </div>
  </div>

  <audio id="zombieSound" src="asesst/zombie-sound.wav" preload="metadata"></audio>

<script src="js/i18n.js"></script>
<script src="js/houses.js"></script>
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/battle.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@2.2.0/dist/tonconnect-ui.min.js"></script>
<script src="js/wallet.js"></script>

<!-- ===== إعلانات 320×50 ثابتة — أسفل الصفحة بعد كل شي ===== -->
<div class="ad-static-bottom" style="display:flex;flex-direction:column;align-items:center;gap:4px;">
  <div id="adBottom1" style="width:320px;height:50px;"></div>
  <div id="adBottom2" style="width:320px;height:50px;"></div>
  <div id="adBottom3" style="width:320px;height:50px;"></div>
</div>

<script src="js/ads.js"></script>
</body>
</html>
